[project]
name = "melomane_ai"
version = "1.0.1"
description = "可扩展的AI中间件"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web框架
    "fastapi>=0.135.0",
    "uvicorn>=0.41.0",
    "pydantic>=2.12.0",
    # 数据库相关
    "psycopg2-binary>=2.9.11",
    "sqlparse>=0.5.5",
    "SQLAlchemy>=2.0.48",
    "pymysql>=1.1.0",
    "sshtunnel>=0.4.0",
    # AI/ML相关
    "openai>=2.24.0,<3.0.0",
    "sentence-transformers>=5.2.0",
    "transformers>=5.3.0",
    "torch>=2.10.0",
    "scikit-learn>=1.8.0",
    "numpy>=2.3.0",
    # 向量数据库
    "chromadb>=1.5.0",
    # 评估工具
    "ragas>=0.4.0",
    "datasets>=4.6.0",
    # 工具库
    "python-dotenv>=1.2.0",
    "paramiko>=3.5.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.3",
    "nltk>=3.9.3",
    "pandas>=2.3.3",
    # 开发工具
    "black>=26.1.0",
    "pytest>=9.0.0",
    "datacompy>=0.19.0",
    "psutil>=7.2.0",
    "prisma>=0.15.0",
    "deepeval>=3.8.8",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
    "notebook",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "ipython",
    "jupyter",
    "notebook",
]

[tool.uv.sources]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
